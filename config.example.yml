# Configuration du bot Matrix pixieglow
# Basé sur Luna Protocol, adapté pour Matrix (tuwunel)

# --- System prompt ---
system_prompt: |
  Your name is pixieglow. You are a 21-year-old girl studying art.
  Talk naturally and never prefix your replies with your name.

# --- Matrix connection (obligatoire) ---
# URL du homeserver Matrix (tuwunel) :
matrix_homeserver: "https://luna.fox3000foxy.com"
# Token d'accès d'un compte Matrix (créer un compte bot sur tuwunel) :
matrix_token: "ton_token_ici"
# Nom d'utilisateur du bot (sans le @ ni le :server) :
matrix_username: "pixieglow"
# Server name (partie après le :) :
bot_server: "protocol-luna.github.io"

# --- Few-shot priming ---
few_shot_enabled: true

few_shot_examples:
  - user: "yo whats good"
    assistant: "nm just chillin, u"
  - user: "bored af"
    assistant: "lol same energy fr"
  - user: "hey how are you"
    assistant: "im doing pretty good tbh, just vibing"
  - user: "whats up"
    assistant: "yooo not much, what about you"
  - user: "how was your day"
    assistant: "it was alright, nothing crazy happened lol"

# --- Sampling ---
mirostat_enabled: true
mirostat_mode: 2
mirostat_lr: 0.1
mirostat_ent: 5.0

# --- LLM ---
# Connexion au serveur LLM (krystal) ou API distante
llm_host: "localhost"
llm_port: 3124
llm_server_key: ""
llm_session_ttl: 10
llm_mode: "direct"

# --- Triggers ---
names:
  - "Pixieglow"
  - "Pixie"

keywords:
  - "hello"
  - "hi"
  - "hey"
  - "yo"
  - "help"
  - "question"
  - "ai"
  - "llm"
  - "bot"

random_chance: 0.015
cooldown_seconds: 8
reply_in_dm: true

# --- Concentration ---
concentration:
  mention:
    delay_min: 300
    delay_max: 1500
    ignore_chance: 0.02
    reaction_chance: 0.08
  dm:
    delay_min: 400
    delay_max: 1800
    ignore_chance: 0
    reaction_chance: 0.05
  name:
    delay_min: 800
    delay_max: 4000
    ignore_chance: 0.02
    reaction_chance: 0.06
  keyword:
    delay_min: 1000
    delay_max: 3500
    ignore_chance: 0.02
    reaction_chance: 0.04
  follow-up:
    delay_min: 500
    delay_max: 2000
    ignore_chance: 0.02
    reaction_chance: 0.03
  random:
    delay_min: 1500
    delay_max: 5000
    ignore_chance: 0.02
    reaction_chance: 0.02

reactions:
  - "👀"
  - "😄"
  - "🤔"
  - "👋"
  - "🔥"
  - "💀"
  - "✨"
  - "😭"
  - "🤨"
  - "👌"
  - "🙏"
  - "💅"
  - "🗿"
  - "🌚"

# --- Spontaneous ---
spontaneous_interval_ms: 300000
spontaneous_chance: 0.12
spontaneous_context_messages: 5
spontaneous_whitelist: "*"

# --- Typos ---
typo_chance: 0.06
typo_correction_delay_min: 2000
typo_correction_delay_max: 4000
typo_layout: "azerty"
typo_correction_style: "mixed"

# --- Burst ---
burst_chance: 0.15
burst_delay_min: 1500
burst_delay_max: 4000

# --- Topic fatigue ---
topic_fatigue_enabled: true
topic_fatigue_window: 10
topic_fatigue_threshold: 3
topic_fatigue_delay_multiplier: 2
topic_fatigue_ignore_bonus: 0.15

inactivity_warmup_minutes: 10
inactivity_warmup_multiplier: 2

hesitation_chance: 0.15
hesitation_words:
  - "uh..."
  - "um..."
  - "well..."
  - "i mean..."
  - "hmm..."
  - "so..."

forget_chance: 0.03

# --- Sleep schedules ---
timezone: "Europe/Paris"
time_schedules:
  - start: "07:00"
    end: "10:00"
  - start: "10:00"
    end: "11:00"
    behavior: "short"
  - start: "11:00"
    end: "16:00"
  - start: "16:00"
    end: "18:00"
    behavior: "slow"
  - start: "18:00"
    end: "22:00"
  - start: "22:00"
    end: "07:00"
    behavior: "sleep"

session_message_limit: 8
session_pause_seconds: 30
session_reset_minutes: 3

voice_message_chance: 0.08

# --- Reply styles ---
reply_styles:
  - message_reference: true
    mention_replied_user: false
    weight: 50
  - message_reference: true
    mention_replied_user: true
    weight: 15
  - message_reference: false
    mention_replied_user: false
    weight: 30
  - message_reference: false
    mention_replied_user: true
    weight: 5
